# Partner Hub · Cloudflare Worker + Durable Object (SQLite) + static assets + Browser Rendering
name = "partner-hub"
main = "src/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "WORKSPACE"
class_name = "Workspace"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Workspace"]

[browser]
binding = "BROWSER"

[observability]
enabled = true

[vars]
# First-run accounts. Only used when the workspace is empty. Passwords are stored as PBKDF2-SHA256 hashes
# (100k iterations, random salt); change them after the first sign-in (sidebar → key icon).
